[package]
name = "north-drive-downloader"
version = "1.0.0"
description = "Direct Google Drive folder downloader for macOS"
authors = ["North Drive"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"
sha2 = "0.10"
md5 = "0.7"
tauri-plugin-dialog = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
